name: Cập nhật báo cáo từ Google Sheet

on:
  schedule:
    - cron: "0 1 * * *"      # 08:00 giờ Việt Nam mỗi ngày
  workflow_dispatch:          # cho phép bấm chạy tay

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lấy dữ liệu & sinh báo cáo
        run: python build_report.py
      - name: Commit nếu có thay đổi
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "chore: cập nhật báo cáo $(date -u +%F)"
          git push
